name: Bug report
description: Report a reproducible Sync2 failure using synthetic or redacted data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include conversation text, credentials, local usernames, device IDs, or private paths.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What user-visible behavior occurred?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps with synthetic paths and IDs.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Node version
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Redacted diagnostics
      description: Include relevant audit/doctor fields only after removing private data.
